services:
  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    container_name: dda-dex
    command: [dex, serve, /etc/dex/config.yaml]
    ports: ["127.0.0.1:5556:5556"]
    volumes:
      - ./.runtime/dex/config.yaml:/etc/dex/config.yaml:ro
      - dex-data:/var/dex
    networks:
      default:
        aliases: [dex.localhost]
    restart: unless-stopped
  keycloak-db:
    image: quay.io/sclorg/postgresql-16-c9s@sha256:fbef891ec464ee8d20332c7f9a4a68decc0b6db8460e7e875df6f33cac5003dc
    container_name: dda-keycloak-db
    environment:
      POSTGRESQL_USER: keycloak
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap first}
      POSTGRESQL_DATABASE: keycloak
      POSTGRESQL_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes: ["keycloak-db-data:/var/lib/pgsql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: dda-keycloak
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://keycloak.localhost:8080
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx1024m
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./.runtime/keycloak/dda-realm.json:/opt/keycloak/data/import/dda-realm.json:ro"]
    depends_on:
      keycloak-db: {condition: service_healthy}
    networks:
      default:
        aliases: [keycloak.localhost]
    restart: unless-stopped
  open-webui:
    environment:
      WEBUI_URL: http://webui.localhost:3000
      WEBUI_ADMIN_EMAIL: webui-bootstrap@dda.test
      WEBUI_ADMIN_NAME: DDA Bootstrap Administrator
      WEBUI_ADMIN_PASSWORD: ${WEBUI_BOOTSTRAP_PASSWORD}
      OAUTH_CLIENT_ID: open-webui
      OAUTH_CLIENT_SECRET: ${WEBUI_CLIENT_SECRET}
      OPENID_PROVIDER_URL: http://keycloak.localhost:8080/realms/dda/.well-known/openid-configuration
      OPENID_REDIRECT_URI: http://webui.localhost:3000/oauth/oidc/callback
      OAUTH_PROVIDER_NAME: DDA SSO
      OAUTH_SCOPES: openid email profile
      OAUTH_UPDATE_NAME_ON_LOGIN: "true"
      ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
      OAUTH_ROLES_CLAIM: roles
      OAUTH_ALLOWED_ROLES: webui-user,webui-admin
      OAUTH_ADMIN_ROLES: webui-admin
      OAUTH_AUTHORIZE_PARAMS: '{"kc_idp_hint":"dex"}'
      OAUTH_CODE_CHALLENGE_METHOD: S256
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "false"
      ENABLE_OAUTH_SIGNUP: "true"
      ENABLE_LOGIN_FORM: "true"
      DEFAULT_USER_ROLE: user
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
    networks:
      default:
        aliases: [webui.localhost]
volumes:
  dex-data:
  keycloak-db-data:
