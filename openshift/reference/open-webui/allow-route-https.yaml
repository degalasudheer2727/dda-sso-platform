{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "open-webui-route-https",
    "namespace": "dda-sso",
    "labels": {
      "app.kubernetes.io/part-of": "dda-sso",
      "app.kubernetes.io/name": "open-webui"
    }
  },
  "spec": {
    "podSelector": {
      "matchLabels": {
        "app": "open-webui"
      }
    },
    "policyTypes": [
      "Egress"
    ],
    "egress": [
      {
        "ports": [
          {
            "port": 443,
            "protocol": "TCP"
          }
        ]
      }
    ]
  }
}
