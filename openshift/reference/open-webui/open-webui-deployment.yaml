{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "open-webui",
    "namespace": "dda-sso",
    "labels": {
      "app.kubernetes.io/part-of": "dda-sso",
      "app.kubernetes.io/name": "open-webui"
    }
  },
  "spec": {
    "replicas": 1,
    "strategy": {
      "type": "Recreate"
    },
    "selector": {
      "matchLabels": {
        "app": "open-webui"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "open-webui",
          "app.kubernetes.io/part-of": "dda-sso"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsNonRoot": true,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "open-webui",
            "image": "registry.example.internal/dda/open-webui-dda:v0.11.3",
            "imagePullPolicy": "IfNotPresent",
            "ports": [
              {
                "containerPort": 8080
              }
            ],
            "env": [
              {
                "name": "WEBUI_URL",
                "value": "https://webui.apps.example.internal"
              },
              {
                "name": "OAUTH_CLIENT_ID",
                "value": "open-webui"
              },
              {
                "name": "OPENID_PROVIDER_URL",
                "value": "https://keycloak.apps.example.internal/realms/dda/.well-known/openid-configuration"
              },
              {
                "name": "OPENID_REDIRECT_URI",
                "value": "https://webui.apps.example.internal/oauth/oidc/callback"
              },
              {
                "name": "OAUTH_PROVIDER_NAME",
                "value": "DDA SSO"
              },
              {
                "name": "OAUTH_UPDATE_NAME_ON_LOGIN",
                "value": "true"
              },
              {
                "name": "ENABLE_OAUTH_ROLE_MANAGEMENT",
                "value": "true"
              },
              {
                "name": "OAUTH_ROLES_CLAIM",
                "value": "roles"
              },
              {
                "name": "OAUTH_ALLOWED_ROLES",
                "value": "webui-user,webui-admin"
              },
              {
                "name": "OAUTH_ADMIN_ROLES",
                "value": "webui-admin"
              },
              {
                "name": "OAUTH_SCOPES",
                "value": "openid email profile"
              },
              {
                "name": "OAUTH_AUTHORIZE_PARAMS",
                "value": "{\"kc_idp_hint\": \"dex\"}"
              },
              {
                "name": "OAUTH_CODE_CHALLENGE_METHOD",
                "value": "S256"
              },
              {
                "name": "ENABLE_OAUTH_SIGNUP",
                "value": "true"
              },
              {
                "name": "ENABLE_LOGIN_FORM",
                "value": "false"
              },
              {
                "name": "OAUTH_MERGE_ACCOUNTS_BY_EMAIL",
                "value": "false"
              },
              {
                "name": "DEFAULT_USER_ROLE",
                "value": "user"
              },
              {
                "name": "WEBUI_ADMIN_EMAIL",
                "value": "webui-admin@apps.example.internal"
              },
              {
                "name": "WEBUI_ADMIN_NAME",
                "value": "DDA Bootstrap Admin"
              },
              {
                "name": "ENABLE_VERSION_UPDATE_CHECK",
                "value": "false"
              },
              {
                "name": "OFFLINE_MODE",
                "value": "true"
              },
              {
                "name": "HF_HUB_OFFLINE",
                "value": "1"
              },
              {
                "name": "DO_NOT_TRACK",
                "value": "true"
              },
              {
                "name": "ANONYMIZED_TELEMETRY",
                "value": "false"
              },
              {
                "name": "HOME",
                "value": "/tmp"
              },
              {
                "name": "OAUTH_CLIENT_SECRET",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "identity-secrets",
                    "key": "WEBUI_CLIENT_SECRET"
                  }
                }
              },
              {
                "name": "WEBUI_SECRET_KEY",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "identity-secrets",
                    "key": "WEBUI_SECRET_KEY"
                  }
                }
              },
              {
                "name": "WEBUI_ADMIN_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "identity-secrets",
                    "key": "WEBUI_ADMIN_PASSWORD"
                  }
                }
              }
            ],
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/app/backend/data"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "500m",
                "memory": "1Gi"
              },
              "limits": {
                "memory": "3Gi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "runAsNonRoot": true
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/health",
                "port": 8080
              },
              "initialDelaySeconds": 10,
              "periodSeconds": 10,
              "timeoutSeconds": 5
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/health",
                "port": 8080
              },
              "initialDelaySeconds": 60,
              "periodSeconds": 20,
              "timeoutSeconds": 5
            },
            "startupProbe": {
              "httpGet": {
                "path": "/health",
                "port": 8080
              },
              "failureThreshold": 60,
              "periodSeconds": 10,
              "timeoutSeconds": 5
            }
          }
        ],
        "volumes": [
          {
            "name": "data",
            "persistentVolumeClaim": {
              "claimName": "webui-data"
            }
          }
        ],
        "terminationGracePeriodSeconds": 60
      }
    }
  }
}
