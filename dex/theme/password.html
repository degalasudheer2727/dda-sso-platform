{{ template "header.html" . }}

<div class="theme-panel">
  <h2 class="theme-heading">Log in to Your Account</h2>
  <form method="post" action="{{ .PostURL }}">
    <div class="theme-form-row">
      <div class="theme-form-label">
        <label for="login">Username or email</label>
      </div>
	  <input tabindex="1" required id="login" name="login" type="text" class="theme-form-input" placeholder="username or email" {{ if .Username }} value="{{ .Username }}" {{ else }} autofocus {{ end }}/>
    </div>
    <div class="theme-form-row">
      <div class="theme-form-label">
        <label for="password">Password</label>
      </div>
	  <input tabindex="2" required id="password" name="password" type="password" class="theme-form-input" placeholder="password" {{ if .Invalid }} autofocus {{ end }}/>
    </div>

    {{ if .Invalid }}
      <div id="login-error" class="dex-error-box">
        Invalid Username or email and password.
      </div>
    {{ end }}

    <button tabindex="3" id="submit-login" type="submit" class="dex-btn theme-btn--primary">Login</button>

  </form>
  {{ if .BackLink }}
  <div class="theme-link-back">
    <a class="dex-subtle-text" href="{{ .BackLink }}">Select another login method.</a>
  </div>
  {{ end }}
</div>


<script type="text/javascript">
  document.querySelector('form').onsubmit = function(e) {
    // Demo aliases resolve to canonical emails; Dex still verifies the password.
    // Never create alternate identity records or modify OIDC subjects.
    var aliases = {"testuser01": "testuser01@dda.test", "testuser02": "testuser02@dda.test", "testuser03": "testuser03@dda.test", "testuser04": "testuser04@dda.test", "testuser05": "testuser05@dda.test", "admin": "admin@dda.test"};
    var login = document.querySelector('#login');
    var value = login.value.trim();
    var alias = value.toLowerCase();
    login.value = Object.prototype.hasOwnProperty.call(aliases, alias) ? aliases[alias] : value;
    var el = document.querySelector('#submit-login');
    el.setAttribute('disabled', 'disabled');
  };
</script>

{{ template "footer.html" . }}
