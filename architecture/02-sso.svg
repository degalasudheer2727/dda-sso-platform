<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1710" viewBox="0 0 2200 1710">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#F4F7FC"/>
<text x="55" y="72" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#172B4D" font-weight="700">02  |  Seamless SSO and administrator authorization</text>
<text x="55" y="123" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#51647E" font-weight="400">BROWSER FRONT CHANNEL + VERIFIED SERVER BACK CHANNELS  •  authorization code flow  •  no password relay to Web UI</text>
<rect x="65" y="195" width="470" height="65" rx="12" fill="#EAF0F9" stroke="#1764C0" stroke-width="2"/>
<text x="83" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1764C0" font-weight="700">BROWSER</text>
<rect x="595" y="195" width="470" height="65" rx="12" fill="#EAF0F9" stroke="#1764C0" stroke-width="2"/>
<text x="613" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1764C0" font-weight="700">OPEN WEBUI</text>
<rect x="1125" y="195" width="470" height="65" rx="12" fill="#EAF0F9" stroke="#7146B8" stroke-width="2"/>
<text x="1143" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7146B8" font-weight="700">KEYCLOAK / dda</text>
<rect x="1655" y="195" width="470" height="65" rx="12" fill="#EAF0F9" stroke="#1764C0" stroke-width="2"/>
<text x="1673" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1764C0" font-weight="700">DEX / local</text>
<rect x="65" y="310" width="470" height="150" rx="12" fill="#FFFFFF" stroke="#1764C0" stroke-width="2"/>
<text x="83" y="341" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1764C0" font-weight="700">1. Begin SSO</text>
<text x="83" y="373" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">/oauth/oidc/login</text>
<text x="83" y="397" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">State + nonce + PKCE challenge</text>
<text x="83" y="421" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">kc_idp_hint=dex</text>
<rect x="1125" y="310" width="470" height="150" rx="12" fill="#FFFFFF" stroke="#1764C0" stroke-width="2"/>
<text x="1143" y="341" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1764C0" font-weight="700">2. Authorize at Keycloak</text>
<text x="1143" y="373" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">/realms/dda/protocol/openid-connect/auth</text>
<text x="1143" y="397" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Client: open-webui</text>
<text x="1143" y="421" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Exact registered Web UI callback</text>
<rect x="1655" y="515" width="470" height="150" rx="12" fill="#FFFFFF" stroke="#087E8B" stroke-width="2"/>
<text x="1673" y="546" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#087E8B" font-weight="700">3. Direct upstream login</text>
<text x="1673" y="578" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Dex /dex/auth/local/login</text>
<text x="1673" y="602" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Email + password entered only here</text>
<text x="1673" y="626" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">No Keycloak selection page</text>
<rect x="1125" y="720" width="470" height="155" rx="12" fill="#FFFFFF" stroke="#1764C0" stroke-width="2"/>
<text x="1143" y="751" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1764C0" font-weight="700">4. Dex → Keycloak callback</text>
<text x="1143" y="783" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">/realms/dda/broker/dex/endpoint</text>
<text x="1143" y="807" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Code exchanged at Dex /token</text>
<text x="1143" y="831" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Broker client: keycloak-dda</text>
<rect x="1125" y="930" width="470" height="185" rx="12" fill="#FFFFFF" stroke="#1764C0" stroke-width="2"/>
<text x="1143" y="961" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1764C0" font-weight="700">5. Validate and provision</text>
<text x="1143" y="993" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Dex issuer + JWKS signature checked</text>
<text x="1143" y="1017" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Stable federated subject maps identity</text>
<text x="1143" y="1041" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Complete profile imported / FORCE sync</text>
<text x="1143" y="1065" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Unique-user flow; collisions fail</text>
<rect x="595" y="1170" width="470" height="185" rx="12" fill="#FFFFFF" stroke="#1764C0" stroke-width="2"/>
<text x="613" y="1201" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1764C0" font-weight="700">6. Keycloak → Web UI callback</text>
<text x="613" y="1233" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">/oauth/oidc/callback</text>
<text x="613" y="1257" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Web UI redeems authorization code</text>
<text x="613" y="1281" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Client secret + PKCE verifier</text>
<text x="613" y="1305" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Validates Keycloak token / claims</text>
<rect x="65" y="1170" width="470" height="185" rx="12" fill="#FFFFFF" stroke="#1764C0" stroke-width="2"/>
<text x="83" y="1201" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1764C0" font-weight="700">7. Application session</text>
<text x="83" y="1233" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Signed-in user lands in Open WebUI</text>
<text x="83" y="1257" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">No second profile/details form</text>
<text x="83" y="1281" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Second Keycloak app reuses SSO</text>
<rect x="1655" y="945" width="470" height="245" rx="12" fill="#EFFBFB" stroke="#087E8B" stroke-width="2"/>
<text x="1673" y="976" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#087E8B" font-weight="700">AUTHORITATIVE PROFILE</text>
<text x="1673" y="1008" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">email: testuser01@dda.test</text>
<text x="1673" y="1032" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">name: Alex Morgan</text>
<text x="1673" y="1056" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Stable subject: test identity ID</text>
<text x="1673" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Admin: admin@dda.test</text>
<text x="1673" y="1104" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">No client secret exposed to browser</text>
<rect x="65" y="565" width="470" height="250" rx="12" fill="#FFF9ED" stroke="#A15C00" stroke-width="2"/>
<text x="83" y="596" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#A15C00" font-weight="700">TWO CONFIDENTIAL CLIENTS</text>
<text x="83" y="628" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Dex client: keycloak-dda</text>
<text x="83" y="652" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Keycloak client: open-webui</text>
<text x="83" y="676" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Independent generated secrets</text>
<text x="83" y="700" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Strict issuer / signature validation</text>
<text x="83" y="724" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">No password/direct grant on app client</text>
<rect x="65" y="865" width="1000" height="235" rx="12" fill="#F0FAF5" stroke="#18794E" stroke-width="2"/>
<text x="83" y="896" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#18794E" font-weight="700">EXPLICIT AUTHORIZATION</text>
<text x="83" y="928" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">openweb-users → webui-user → user</text>
<text x="83" y="952" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">openwebui-admins → webui-admin → admin</text>
<text x="83" y="976" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Admin also: realm-management/realm-admin</text>
<text x="83" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">Master admin remains separate</text>
<text x="83" y="1024" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172B4D" font-weight="400">No email-based automatic account merge</text>
<rect x="65" y="1420" width="2060" height="205" rx="12" fill="#FFF9ED" stroke="#A15C00" stroke-width="2"/>
<text x="83" y="1451" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#A15C00" font-weight="700">SESSION AND LOGOUT BOUNDARY</text>
<text x="83" y="1483" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172B4D" font-weight="400">Keycloak access token: 5 minutes • SSO idle: 30 minutes • SSO max: 8 hours</text>
<text x="83" y="1508" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172B4D" font-weight="400">Ending the app / Keycloak session does not promise immediate revocation of every upstream session or issued JWT.</text>
<text x="83" y="1533" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172B4D" font-weight="400">Enterprise logout, deprovisioning, MFA and expiry semantics must be validated with the actual upstream provider.</text>
<polyline points="535,385.0 560,385 1100,385 1125,385.0" fill="none" stroke="#1764C0" stroke-width="2.4" marker-end="url(#arrow)" />
