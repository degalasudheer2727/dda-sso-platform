<rect x="1640.75" y="359.0" width="203.5" height="23" rx="4" fill="#FFFFFF"/>
<text x="1742.5" y="376.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#7146B8">automatic broker redirect</text>
