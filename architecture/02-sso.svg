<text x="1360.0" y="1179.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#7146B8">Keycloak authorization code</text>
<polyline points="595,1262.5 535,1262.5" fill="none" stroke="#1764C0" stroke-width="2.4" marker-end="url(#arrow)" />
<rect x="470.75" y="1236.5" width="188.5" height="23" rx="4" fill="#FFFFFF"/>
<text x="565.0" y="1253.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1764C0">app session established</text>
<text x="55" y="1685" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#51647E" font-weight="400">DDA • Deployed state and enterprise handoff • 14 September 2026 • No credentials embedded</text>
</svg>